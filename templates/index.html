<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Global Chat</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --crimson: #dc143c;
            --crimson-dark: #8b001d;
            --text-light: #f0f0f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* هدر و پروفایل */
        header { background: var(--bg-panel); border-bottom: 2px solid var(--crimson); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        /* لوگوی متحرک قرمز براق */
        .logo { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: #ff1a40; 
            letter-spacing: 3px; 
            text-shadow: 0 0 10px #ff0033, 0 0 20px #dc143c, 0 0 30px #8b001d;
            animation: glowing-logo 2s ease-in-out infinite alternate;
            cursor: pointer;
        }
        @keyframes glowing-logo {
            from { text-shadow: 0 0 5px #ff0033, 0 0 10px #dc143c; }
            to { text-shadow: 0 0 15px #ff4d6d, 0 0 25px #ff1a40, 0 0 35px #dc143c; }
        }

        .profile-bar { display: flex; align-items: center; gap: 12px; cursor: pointer; background: #1c1c24; padding: 5px 12px; border-radius: 20px; border: 1px solid #333; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--crimson); display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; overflow: hidden; object-fit: cover; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn { background: var(--crimson); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .btn:hover { background: var(--crimson-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--crimson); }

        /* نوار وضعیت آنلاین */
        .status-bar { background: #0f0f13; padding: 6px 20px; font-size: 0.75rem; color: #00ff88; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

        /* بخش چت */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-card { background: var(--bg-panel); border-right: 4px solid var(--crimson); padding: 10px 14px; border-radius: 10px; max-width: 75%; position: relative; }
        
        /* پیام همگانی مدیر */
        .msg-broadcast { background: linear-gradient(135deg, #330000, #141418); border-right: 4px solid #ffcc00; border: 1px solid #ffcc00; max-width: 90% !important; width: 100%; }

        /* استایل رنگین‌کمانی مخصوص کاربران پریمیوم */
        .msg-premium {
            background: linear-gradient(135deg, #ff0055, #ff7700, #00bfff, #7700ff);
            background-size: 200% 200%;
            animation: rainbow 4s ease infinite;
            border-right: none;
            color: #fff;
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.4);
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .msg-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 0.85rem; font-weight: bold; }
        .star-badge { color: #00d9ff; font-size: 1rem; filter: drop-shadow(0 0 4px #0088ff); margin-right: 4px; }
        .msg-time { font-size: 0.65rem; color: #ccc; margin-top: 4px; text-align: left; }
        .report-btn { background: rgba(0,0,0,0.4); color: #ffcccc; border: none; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; cursor: pointer; }

        /* بخش ارسال پیام و ایموجی */
        .bottom-area { background: var(--bg-panel); border-top: 1px solid #2a2a30; padding: 10px 20px; }
        .emoji-bar { display: flex; gap: 10px; margin-bottom: 8px; font-size: 1.2rem; cursor: pointer; user-select: none; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"], textarea { flex: 1; background: #0a0a0c; border: 1px solid var(--crimson); color: #fff; padding: 10px; border-radius: 8px; outline: none; }

        /* پنجره‌های پاپ‌آپ */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--bg-panel); border: 2px solid var(--crimson); padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .hidden { display: none !important; }
        .plan-btn { background: #1f1f26; border: 1px solid var(--crimson); color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .plan-btn:hover { background: var(--crimson); }

        /* صندوق پشتیبانی */
        .support-box { max-height: 150px; overflow-y: auto; background: #0a0a0c; border: 1px solid #333; padding: 8px; border-radius: 8px; text-align: right; font-size: 0.8rem; display: flex; flex-direction: column; gap: 6px; }
        .support-msg { padding: 6px 10px; border-radius: 6px; max-width: 85%; }
        .support-user { background: #1f1f26; align-self: flex-start; }
        .support-admin { background: var(--crimson-dark); align-self: flex-end; }
    </style>
</head>
<body>

    <!-- پنجره ورود اولیه نام کاربری -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--crimson);">ورود به Y2K</h2>
            <p>نام کاربری خود را وارد کنید:</p>
            <input type="text" id="username-input" placeholder="مثلاً: Ali_Y2K">
            <button class="btn" onclick="registerUser()">ورود به چت‌روم</button>
        </div>
    </div>

    <!-- پنجره حساب کاربری و پروفایل -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <h3>⚙️ حساب کاربری شما</h3>
            <div style="display: flex; flex-direction: column; gap: 8px; text-align: right;">
                <label style="font-size: 0.8rem;">نام کاربری:</label>
                <input type="text" id="edit-username">
                <label style="font-size: 0.8rem;">لینک عکس پروفایل (آواتار):</label>
                <input type="text" id="edit-avatar" placeholder="https://example.com/photo.jpg">
            </div>
            <div style="background: #1c1c24; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.85rem;" id="profile-status-box">
                وضعیت اشتراک: بررسی...
            </div>
            <button class="btn" onclick="saveProfile()">ذخیره تغییرات</button>
            <button class="btn btn-outline" onclick="toggleModal('profile-modal')">بستن</button>
        </div>
    </div>

    <!-- پنجره خرید پریمیوم -->
    <div id="premium-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🌟 اشتراک ویژه Y2K</h3>
            <p style="font-size: 0.85rem;">امکانات: تیک آبی ستاره‌ای 💠 + پس‌زمینه رنگین‌کمانی پیام‌ها</p>
            <button class="plan-btn" onclick="buyPremium(1, 'https://your-payment-link-1.com')">اشتراک ۱ ماهه</button>
            <button class="plan-btn" onclick="buyPremium(2, 'https://your-payment-link-2.com')">اشتراک ۲ ماهه</button>
            <button class="plan-btn" onclick="buyPremium(3, 'https://your-payment-link-3.com')">اشتراک ۳ ماهه</button>
            <button class="btn btn-outline" onclick="toggleModal('premium-modal')">بستن</button>
        </div>
    </div>

    <!-- پنجره پشتیبانی و صندوق پیام‌ها -->
    <div id="support-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🎧 پشتیبانی آنلاین</h3>
            <div class="support-box" id="support-chat-box">
                <!-- تاریخچه تیکت‌ها اینجا لود میشود -->
            </div>
            <textarea id="support-text" rows="3" placeholder="پیام خود برای مدیر را بنویسید..."></textarea>
            <button class="btn" onclick="sendSupport()">ارسال پیام</button>
            <button class="btn btn-outline" onclick="toggleModal('support-modal')">بستن</button>
        </div>
    </div>

    <!-- هدر برنامه -->
    <header>
        <div class="logo">Y2K CHAT</div>
        <div class="profile-bar" onclick="openProfileModal()">
            <div class="avatar" id="header-avatar-box">U</div>
            <div>
                <div id="display-name" style="font-weight: bold; font-size: 0.9rem;">کاربر</div>
                <div id="premium-badge-text" style="font-size: 0.7rem; color: #aaa;">حساب عادی</div>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn" onclick="toggleModal('premium-modal')">🌟 پریمیوم</button>
            <button class="btn btn-outline" onclick="toggleModal('support-modal')">🎧 پشتیبانی</button>
        </div>
    </header>

    <!-- نوار وضعیت آنلاین -->
    <div class="status-bar">
        <span id="online-counter">🟢 افراد آنلاین: 1 نفر</span>
        <span id="ban-warning" style="color: #ff4d4d; display: none;"></span>
    </div>

    <!-- محیط چت جهانی -->
    <div id="chat-box"></div>

    <!-- کادر ارسال پیام -->
    <div class="bottom-area">
        <div class="emoji-bar">
            <span onclick="addEmoji('😀')">😀</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('🎉')">🎉</span>
            <span onclick="addEmoji('👍')">👍</span>
        </div>
        <div class="input-group">
            <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentAvatar = "";

        function registerUser() {
            const val = document.getElementById('username-input').value.trim();
            if (!val) return alert("لطفاً یک نام کاربری وارد کنید!");
            currentUser = val;
            document.getElementById('login-modal').classList.add('hidden');
            syncWithServer();
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function openProfileModal() {
            document.getElementById('edit-username').value = currentUser;
            document.getElementById('edit-avatar').value = currentAvatar;
            toggleModal('profile-modal');
        }

        async function saveProfile() {
            const newName = document.getElementById('edit-username').value.trim();
            const avatar = document.getElementById('edit-avatar').value.trim();
            if (!newName) return alert("نام کاربری نمی‌تواند خالی باشد!");

            const res = await fetch('/api/profile/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({old_username: currentUser, new_username: newName, avatar: avatar})
            });
            const data = await res.json();
            if (res.status === 400) {
                alert(data.message);
            } else {
                currentUser = data.username;
                currentAvatar = data.avatar;
                toggleModal('profile-modal');
                syncWithServer();
            }
        }

        function addEmoji(emoji) {
            document.getElementById('msg-input').value += emoji;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const res = await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, text: text})
            });
            const data = await res.json();
            if (res.status === 403) {
                alert(data.message);
            } else {
                input.value = "";
                syncWithServer();
            }
        }

        async function syncWithServer() {
            if (!currentUser) return;
            const res = await fetch('/api/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser})
            });
            const data = await res.json();

            // بررسی مسدودیت
            if (data.user_info && data.user_info.banned) {
                document.getElementById('ban-warning').style.display = "block";
                document.getElementById('ban-warning').innerText = data.user_info.ban_msg;
            } else {
                document.getElementById('ban-warning').style.display = "none";
            }

            // به‌روزرسانی هدر و پروفایل
            document.getElementById('display-name').innerText = currentUser;
            document.getElementById('online-counter').innerText = `🟢 افراد آنلاین: ${data.online_count} نفر`;
            
            const avatarBox = document.getElementById('header-avatar-box');
            if (data.user_info && data.user_info.avatar) {
                currentAvatar = data.user_info.avatar;
                avatarBox.innerHTML = `<img src="${currentAvatar}" alt="Avatar">`;
            } else {
                avatarBox.innerText = currentUser[0].toUpperCase();
            }

            if (data.user_info && data.user_info.is_premium) {
                document.getElementById('premium-badge-text').innerHTML = `پریمیوم (${data.user_info.premium_days} روز مانده) 💠`;
                document.getElementById('premium-badge-text').style.color = "#00d9ff";
                document.getElementById('profile-status-box').innerHTML = `🌟 اشتراک ویژه فعال است (${data.user_info.premium_days} روز باقی‌مانده)`;
            } else {
                document.getElementById('premium-badge-text').innerHTML = "حساب عادی";
                document.getElementById('profile-status-box').innerHTML = "اشتراک ویژه ندارید (حساب عادی)";
            }

            // به‌روزرسانی صندوق پشتیبانی
            if (data.user_info && data.user_info.support_msgs) {
                const sBox = document.getElementById('support-chat-box');
                sBox.innerHTML = "";
                data.user_info.support_msgs.forEach(sm => {
                    const d = document.createElement('div');
                    d.className = `support-msg ${sm.sender === 'user' ? 'support-user' : 'support-admin'}`;
                    d.innerHTML = `<b>${sm.sender === 'user' ? 'شما' : 'مدیر'}:</b> ${sm.text} <span style="font-size:0.6rem; color:#aaa;">(${sm.time})</span>`;
                    sBox.appendChild(d);
                });
                sBox.scrollTop = sBox.scrollHeight;
            }

            // رندر پیام‌های چت عمومی
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            data.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = "msg-card " + (m.is_broadcast ? "msg-broadcast" : (m.is_premium ? "msg-premium" : ""));
                const badge = m.is_premium ? `<span class="star-badge" title="پریمیوم">✦☑️</span>` : "";
                
                let avatarHTML = `<div class="avatar" style="width:26px; height:26px; font-size:0.7rem; display:inline-flex; margin-left:6px;">${m.username[0].toUpperCase()}</div>`;
                if(m.avatar) {
                    avatarHTML = `<div class="avatar" style="width:26px; height:26px; display:inline-flex; margin-left:6px;"><img src="${m.avatar}"></div>`;
                }

                div.innerHTML = `
                    <div class="msg-header">
                        <span style="display:flex; align-items:center;">${avatarHTML} ${m.username} ${badge}</span>
                        ${!m.is_broadcast ? `<button class="report-btn" onclick="reportMsg(${m.id})">🚨 گزارش</button>` : ''}
                    </div>
                    <div style="word-break: break-all; margin-top:4px;">${m.text}</div>
                    <div class="msg-time">${m.time}</div>
                `;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function reportMsg(id) {
            await fetch('/api/report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({msg_id: id})
            });
            alert("گزارش تخلف و گزینه‌های جریمه برای مدیر در تلگرام ارسال شد.");
        }

        async function buyPremium(plan, paymentUrl) {
            await fetch('/api/request_premium', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, plan: plan})
            });
            window.open(paymentUrl, '_blank');
            alert("درخواست اشتراک ارسال شد. پس از واریز وجه، مدیر از طریق ربات تلگرام تیک آبی شما را فعال می‌کند.");
            toggleModal('premium-modal');
        }

        async function sendSupport() {
            const txt = document.getElementById('support-text').value.trim();
            if (!txt) return;
            await fetch('/api/support/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: currentUser, text: txt})
            });
            document.getElementById('support-text').value = "";
            syncWithServer();
        }

        setInterval(syncWithServer, 2000);
    </script>
</body>
</html>
